---
name: Feature request
description: Suggest an improvement to Design Tracker
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Keep examples sanitized. No private project names or credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request does not include secrets or personal data
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing in the current workflow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change (command, rule, template, docs)?
    validations:
      required: true
